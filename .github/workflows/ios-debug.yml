name: "Unsigned IPA Build"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_unsigned_ipa:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 26.6

      - name: Cache Xcode build products and Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/DerivedData
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-xcode26-${{ hashFiles('iTorrent.xcodeproj/project.pbxproj', 'iTorrent.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'iTorrent.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode26-

      - name: Prepare build dependencies
        run: |
          if ! brew list --versions boost >/dev/null 2>&1; then
            brew install boost
          fi

      - name: Provide optional Firebase resource for unsigned build
        run: |
          mkdir -p iTorrent/Core/Assets
          if [ ! -f iTorrent/Core/Assets/GoogleService-Info.plist ]; then
            cat > iTorrent/Core/Assets/GoogleService-Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict/></plist>
          PLIST
          fi

      - name: Build LibTorrent
        run: ./Submodules/LibTorrent-Swift/make.sh

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace iTorrent.xcworkspace \
            -scheme iTorrent \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) UNSIGNED_IPA_BUILD' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/iTorrent.app"
          test -d "$APP_PATH" || { echo "Built app not found at $APP_PATH"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/iTorrent.app"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/iTorrent-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/iTorrent-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: iTorrent-unsigned-ipa
          path: iTorrent-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
