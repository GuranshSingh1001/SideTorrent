name: Build and Release IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version to publish (for example, 1.0.2)"
        required: true
        type: string
      release_notes:
        description: "Release notes (optional)"
        required: false
        type: string
        default: "Automated iOS IPA build."

permissions:
  contents: write

concurrency:
  group: ipa-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build unsigned IPA and publish release
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and release tag
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '$VERSION'. Use a version such as 1.0.2." >&2
            exit 1
          fi
          TAG="v$VERSION"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; choose a new version." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; choose a new version." >&2
            exit 1
          fi

      - name: Update source version
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          build = os.environ["BUILD_NUMBER"]
          project = Path("iTorrent.xcodeproj/project.pbxproj")
          if not project.is_file():
              raise SystemExit(f"Missing Xcode project: {project}")
          text = project.read_text()
          text, marketing_count = re.subn(r"MARKETING_VERSION = [^;]+;", f"MARKETING_VERSION = {version};", text)
          text, build_count = re.subn(r"CURRENT_PROJECT_VERSION = [^;]+;", f"CURRENT_PROJECT_VERSION = {build};", text)
          if marketing_count == 0 or build_count == 0:
              raise SystemExit("Could not find version settings in project.pbxproj")
          project.write_text(text)
          readme = Path("README.md")
          if readme.exists():
              readme_text = readme.read_text()
              readme_text = re.sub(r"(?i)(SideTorrent\s+)[vV]?\d+\.\d+(?:\.\d+)?", lambda m: m.group(1) + version, readme_text, count=1)
              readme.write_text(readme_text)
          print(f"Set MARKETING_VERSION={version}; CURRENT_PROJECT_VERSION={build}")
          PY

      - name: Commit version update
        id: version_commit
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iTorrent.xcodeproj/project.pbxproj README.md
          if git diff --cached --quiet; then
            echo "Version files already match the requested release version."
          else
            git commit -m "chore: prepare SideTorrent v${VERSION} (build ${BUILD_NUMBER})"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          RELEASE_SHA="$(git rev-parse HEAD)"
          echo "sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Select Xcode and resolve scheme
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -list -project iTorrent.xcodeproj
          xcodebuild -resolvePackageDependencies -project iTorrent.xcodeproj -scheme iTorrent

      - name: Archive iOS app without code signing
        run: |
          set -euo pipefail
          xcodebuild \
            -project iTorrent.xcodeproj \
            -scheme iTorrent \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SideTorrent.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Package unsigned IPA
        id: ipa
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/SideTorrent.xcarchive/Products/Applications/iTorrent.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "Expected app not found in archive: $APP_PATH" >&2
            find "$RUNNER_TEMP/SideTorrent.xcarchive/Products/Applications" -maxdepth 3 -print || true
            exit 1
          fi
          # An unsigned IPA is a ZIP container with Payload/<AppName>.app inside.
          # It is not installable on a device until it is signed and provisioned.
          PACKAGE_DIR="$RUNNER_TEMP/unsigned-ipa"
          mkdir -p "$PACKAGE_DIR/Payload" dist
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/"
          rm -rf "$PACKAGE_DIR/Payload/iTorrent.app/_CodeSignature"
          find "$PACKAGE_DIR/Payload" -name '_CodeSignature' -type d -prune -exec rm -rf {} +
          find "$PACKAGE_DIR/Payload" -name 'embedded.mobileprovision' -type f -delete
          VERSION="${{ inputs.version }}"
          (cd "$PACKAGE_DIR" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/SideTorrent-${VERSION}-unsigned.ipa" Payload)
          test -s "dist/SideTorrent-${VERSION}-unsigned.ipa"
          unzip -l "dist/SideTorrent-${VERSION}-unsigned.ipa" | grep -q 'Payload/iTorrent.app/'
          echo "path=dist/SideTorrent-${VERSION}-unsigned.ipa" >> "$GITHUB_OUTPUT"
      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideTorrent-${{ inputs.version }}-unsigned-ipa
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release and attach IPA
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          RELEASE_SHA="${{ steps.version_commit.outputs.sha }}"
          printf '%s\n\n**This is an unsigned IPA.** It is not directly installable on a standard iPhone or iPad until it is signed and provisioned.\n\nBuilt from commit %s using GitHub Actions.\n' "$RELEASE_NOTES" "$RELEASE_SHA" > "$NOTES_FILE"
          gh release create "$TAG" "$IPA_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "SideTorrent $VERSION" \
            --notes-file "$NOTES_FILE"
