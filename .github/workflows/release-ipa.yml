name: Build and Release IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version to publish (for example, 1.0.2)"
        required: true
        type: string
      release_notes:
        description: "Release notes (optional)"
        required: false
        type: string
        default: "Automated iOS IPA build."

permissions:
  contents: write

concurrency:
  group: ipa-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Archive, export IPA, and publish release
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and release tag
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version '$VERSION'. Use a version such as 1.0.2." >&2
            exit 1
          fi
          TAG="v$VERSION"
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; choose a new version." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; choose a new version." >&2
            exit 1
          fi

      - name: Update source version
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          build = os.environ["BUILD_NUMBER"]
          project = Path("iTorrent.xcodeproj/project.pbxproj")
          if not project.is_file():
              raise SystemExit(f"Missing Xcode project: {project}")
          text = project.read_text()
          text, marketing_count = re.subn(r"MARKETING_VERSION = [^;]+;", f"MARKETING_VERSION = {version};", text)
          text, build_count = re.subn(r"CURRENT_PROJECT_VERSION = [^;]+;", f"CURRENT_PROJECT_VERSION = {build};", text)
          if marketing_count == 0 or build_count == 0:
              raise SystemExit("Could not find version settings in project.pbxproj")
          project.write_text(text)
          readme = Path("README.md")
          if readme.exists():
              readme_text = readme.read_text()
              readme_text = re.sub(r"(?i)(SideTorrent\s+)[vV]?\d+\.\d+(?:\.\d+)?", lambda m: m.group(1) + version, readme_text, count=1)
              readme.write_text(readme_text)
          print(f"Set MARKETING_VERSION={version}; CURRENT_PROJECT_VERSION={build}")
          PY

      - name: Commit version update
        id: version_commit
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iTorrent.xcodeproj/project.pbxproj README.md
          if git diff --cached --quiet; then
            echo "Version files already match the requested release version."
          else
            git commit -m "chore: prepare SideTorrent v${VERSION} (build ${BUILD_NUMBER})"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          RELEASE_SHA="$(git rev-parse HEAD)"
          echo "sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Select Xcode and resolve scheme
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -list -project iTorrent.xcodeproj
          xcodebuild -resolvePackageDependencies -project iTorrent.xcodeproj -scheme iTorrent

      - name: Configure App Store Connect API authentication
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$ASC_KEY_ID" || -z "$ASC_ISSUER_ID" || -z "$ASC_PRIVATE_KEY" ]]; then
            echo "Missing required secrets: APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_PRIVATE_KEY." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          {
            echo "ASC_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
            echo "ASC_KEY_ID=$ASC_KEY_ID"
            echo "ASC_ISSUER_ID=$ASC_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Archive iOS app
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$TEAM_ID" ]]; then
            echo "Set repository variable APPLE_TEAM_ID to the Apple Developer Team ID." >&2
            exit 1
          fi
          xcodebuild \
            -project iTorrent.xcodeproj \
            -scheme iTorrent \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SideTorrent.xcarchive" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            MARKETING_VERSION="${{ inputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Export IPA
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SideTorrent.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -allowProvisioningUpdates

      - name: Locate IPA (including zipped build outputs)
        id: ipa
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ipa-unpacked"
          IPA_PATH="$(find "$RUNNER_TEMP/export" -type f -name '*.ipa' -print -quit || true)"
          if [[ -z "$IPA_PATH" ]]; then
            ZIP_PATH="$(find "$RUNNER_TEMP/export" -type f -name '*.zip' -print -quit || true)"
            if [[ -n "$ZIP_PATH" ]]; then
              unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/ipa-unpacked"
              IPA_PATH="$(find "$RUNNER_TEMP/ipa-unpacked" -type f -name '*.ipa' -print -quit || true)"
            fi
          fi
          if [[ -z "$IPA_PATH" || ! -f "$IPA_PATH" ]]; then
            echo "No .ipa was produced by the export step." >&2
            find "$RUNNER_TEMP/export" -maxdepth 4 -type f -print || true
            exit 1
          fi
          mkdir -p dist
          VERSION="${{ inputs.version }}"
          cp "$IPA_PATH" "dist/SideTorrent-${VERSION}.ipa"
          echo "path=dist/SideTorrent-${VERSION}.ipa" >> "$GITHUB_OUTPUT"
          test -s "dist/SideTorrent-${VERSION}.ipa"
          unzip -l "dist/SideTorrent-${VERSION}.ipa" | grep -q 'Payload/.*\.app/' || {
            echo "The exported IPA does not contain an app Payload." >&2
            exit 1
          }

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SideTorrent-${{ inputs.version }}-ipa
          path: ${{ steps.ipa.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub release and attach IPA
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          IPA_PATH: ${{ steps.ipa.outputs.path }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          printf '%s\n\nBuilt from commit %s using GitHub Actions.\n' "$RELEASE_NOTES" "$GITHUB_SHA" > "$NOTES_FILE"
          gh release create "$TAG" "$IPA_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "SideTorrent $VERSION" \
            --notes-file "$NOTES_FILE"
